spring:
  application:
    name: pulsedesk
  datasource:
    url: jdbc:h2:mem:pulsedesk;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

# Hugging Face Inference Providers (chat completions) — set HF_API_TOKEN in your environment
huggingface:
  api-url: https://router.huggingface.co/v1/chat/completions
  model: Qwen/Qwen2.5-1.5B-Instruct:featherless-ai
  api-token: ${HF_API_TOKEN:}
