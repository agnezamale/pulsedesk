spring:
  application:
    name: pulsedesk
  datasource:
    url: jdbc:h2:mem:pulsedesk;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}

# huggingface = AI triage (default), dummy = keyword-only triage
pulsedesk:
  triage:
    provider: huggingface
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Hugging Face Inference Providers (chat completions) — set HF_API_TOKEN in your environment
huggingface:
  api-url: https://router.huggingface.co/v1/chat/completions
  model: mistralai/Mistral-7B-Instruct-v0.2:featherless-ai
  api-token: ${HF_API_TOKEN:}
